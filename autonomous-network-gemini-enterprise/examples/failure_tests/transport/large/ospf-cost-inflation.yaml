# NetworkFailure: OSPF Cost Inflation on Core Link (Large Network)
#
# Fault Type   : OSPF_COST_INFLATION
# Target       : P1-P3 link (London-Paris core mesh)
# Mechanism    : Set OSPF cost to 65535 on p1's eth2 interface (p1-p3 link)
# Impact       : Cross-region traffic (UK ↔ France, UK ↔ Germany via Paris) must
#                reroute through alternate core paths (p1→p2→p3 or p1→p6→p5→p3).
#                Affects multiple lower tiers (PA, AR, PE layers). OSPF adjacency
#                remains Full, requiring GNN to detect via performance anomalies.
#
# Traffic Impact:
#   - UK→France traffic (pe1/pe2 → pe5/pe6/pe11) reroutes via p2→p3 or p1→p4→p3
#   - Increased latency: ~15-25ms (additional 2-4 hops through core)
#   - Potential bottlenecks at pa3, pa4 (France pre-aggregation) due to concentrated
#     rerouted traffic
#   - Multiple VPN flows affected (~8-12 BLUE VPN spoke-to-hub flows + RED VPN mesh)
#   - Path metrics change across all 4 tiers
#
# GNN Detection Signatures:
#   D-GAT  : Directed edge P1(eth2)→P3(eth2) shows cost spike in OSPF metrics
#   STGNN  : Latency anomaly on cross-region flows (UK ↔ France)
#   HetGNN : Path metrics change in embeddings across all 4 tiers (core, PA, AR, PE)
#
# Related Scenario: docs/scenarios/large/scenario_1_ospf_cost_inflation.md
#
# Usage:
#   kubectl apply  -f ospf-cost-inflation.yaml    # Inflate OSPF cost
#   kubectl delete -f ospf-cost-inflation.yaml    # Restore original cost
---
apiVersion: google.dev/v1
kind: NetworkFailure
metadata:
  name: ospf-cost-inflation-p1-p3-cross-region
  namespace: network
  labels:
    scenario: large-network
    fault-type: ospf-cost-inflation
    severity: medium
spec:
  writeMode: direct
  failureType: OSPF_COST_INFLATION
  infrastructureRef: complex-network-infra
  target:
    router: p1
    interface: eth2  # p1-p3 link (London-Paris)
  parameters:
    ospf_cost: 65535
