    # Full mesh between 6 core P routers - 15 links @ 10Gbps
    - name: p1-p2
      subnet: "172.16.0.0/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p1"
          interface: "eth1"
          ip_address: "172.16.0.1"
        - router_name: "p2"
          interface: "eth1"
          ip_address: "172.16.0.2"
    - name: p1-p3
      subnet: "172.16.0.4/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
