apiVersion: google.dev/v1
kind: VyOSInfrastructure
metadata:
  name: medium-network-infra
  namespace: network
  labels:
    type: telco-lab
    environment: medium-network
spec:
  description: "Medium 3-tier hierarchical network with multi-area OSPF and 5G RAN"
  networks:
    # ===================================================================
    # CORE MESH (P-P links) @ 10Gbps
    # ===================================================================
    - name: p1-p2
      subnet: "172.16.0.0/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p1"
          interface: "eth1"
          ip_address: "172.16.0.1"
        - router_name: "p2"
          interface: "eth1"
          ip_address: "172.16.0.2"
    - name: p1-p3
      subnet: "172.16.0.4/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p1"
          interface: "eth2"
          ip_address: "172.16.0.5"
        - router_name: "p3"
          interface: "eth1"
          ip_address: "172.16.0.6"
    - name: p1-p4
      subnet: "172.16.0.8/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p1"
          interface: "eth3"
          ip_address: "172.16.0.9"
        - router_name: "p4"
          interface: "eth1"
          ip_address: "172.16.0.10"
    - name: p2-p3
      subnet: "172.16.0.12/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p2"
          interface: "eth2"
          ip_address: "172.16.0.13"
        - router_name: "p3"
          interface: "eth2"
          ip_address: "172.16.0.14"
    - name: p2-p4
      subnet: "172.16.0.16/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p2"
          interface: "eth3"
          ip_address: "172.16.0.17"
        - router_name: "p4"
          interface: "eth2"
          ip_address: "172.16.0.18"
    - name: p3-p4
      subnet: "172.16.0.20/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p3"
          interface: "eth3"
          ip_address: "172.16.0.21"
        - router_name: "p4"
          interface: "eth3"
          ip_address: "172.16.0.22"

    # ===================================================================
    # CORE-RR links @ 10Gbps
    # ===================================================================
    - name: p1-rr1
      subnet: "172.16.10.0/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p1"
          interface: "eth4"
          ip_address: "172.16.10.1"
        - router_name: "rr1"
          interface: "eth1"
          ip_address: "172.16.10.2"
    - name: p2-rr1
      subnet: "172.16.10.4/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p2"
          interface: "eth4"
          ip_address: "172.16.10.5"
        - router_name: "rr1"
          interface: "eth2"
          ip_address: "172.16.10.6"
    - name: p3-rr2
      subnet: "172.16.10.8/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p3"
          interface: "eth4"
          ip_address: "172.16.10.9"
        - router_name: "rr2"
          interface: "eth1"
          ip_address: "172.16.10.10"
    - name: p4-rr2
      subnet: "172.16.10.12/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p4"
          interface: "eth4"
          ip_address: "172.16.10.13"
        - router_name: "rr2"
          interface: "eth2"
          ip_address: "172.16.10.14"

    # ===================================================================
    # CORE-PA links @ 10Gbps (each PA dual-homed to 2 P routers)
    # ===================================================================
    - name: p1-pa1
      subnet: "172.16.20.0/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p1"
          interface: "eth5"
          ip_address: "172.16.20.1"
        - router_name: "pa1"
          interface: "eth1"
          ip_address: "172.16.20.2"
    - name: p2-pa1
      subnet: "172.16.20.4/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p2"
          interface: "eth5"
          ip_address: "172.16.20.5"
        - router_name: "pa1"
          interface: "eth2"
          ip_address: "172.16.20.6"
    - name: p1-pa2
      subnet: "172.16.20.8/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p1"
          interface: "eth6"
          ip_address: "172.16.20.9"
        - router_name: "pa2"
          interface: "eth1"
          ip_address: "172.16.20.10"
    - name: p3-pa2
      subnet: "172.16.20.12/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p3"
          interface: "eth5"
          ip_address: "172.16.20.13"
        - router_name: "pa2"
          interface: "eth2"
          ip_address: "172.16.20.14"
    - name: p2-pa3
      subnet: "172.16.20.16/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p2"
          interface: "eth6"
          ip_address: "172.16.20.17"
        - router_name: "pa3"
          interface: "eth1"
          ip_address: "172.16.20.18"
    - name: p4-pa3
      subnet: "172.16.20.20/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p4"
          interface: "eth5"
          ip_address: "172.16.20.21"
        - router_name: "pa3"
          interface: "eth2"
          ip_address: "172.16.20.22"
    - name: p3-pa4
      subnet: "172.16.20.24/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p3"
          interface: "eth6"
          ip_address: "172.16.20.25"
        - router_name: "pa4"
          interface: "eth1"
          ip_address: "172.16.20.26"
    - name: p4-pa4
      subnet: "172.16.20.28/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p4"
          interface: "eth6"
          ip_address: "172.16.20.29"
        - router_name: "pa4"
          interface: "eth2"
          ip_address: "172.16.20.30"

    # ===================================================================
    # PA ring links @ 10Gbps (for redundancy)
    # ===================================================================
    - name: pa1-pa2
      subnet: "172.16.30.0/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa1"
          interface: "eth3"
          ip_address: "172.16.30.1"
        - router_name: "pa2"
          interface: "eth3"
          ip_address: "172.16.30.2"
    - name: pa2-pa3
      subnet: "172.16.30.4/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa2"
          interface: "eth4"
          ip_address: "172.16.30.5"
        - router_name: "pa3"
          interface: "eth3"
          ip_address: "172.16.30.6"
    - name: pa3-pa4
      subnet: "172.16.30.8/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa3"
          interface: "eth4"
          ip_address: "172.16.30.9"
        - router_name: "pa4"
          interface: "eth3"
          ip_address: "172.16.30.10"
    - name: pa4-pa1
      subnet: "172.16.30.12/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa4"
          interface: "eth4"
          ip_address: "172.16.30.13"
        - router_name: "pa1"
          interface: "eth4"
          ip_address: "172.16.30.14"

    # ===================================================================
    # PA-PE links @ 1Gbps (each PE dual-homed to 2 PAs)
    # ===================================================================
    - name: pa1-pe1
      subnet: "172.16.40.0/30"
      bandwidth: "1gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa1"
          interface: "eth5"
          ip_address: "172.16.40.1"
        - router_name: "pe1"
          interface: "eth1"
          ip_address: "172.16.40.2"
    - name: pa2-pe1
      subnet: "172.16.40.4/30"
      bandwidth: "1gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa2"
          interface: "eth5"
          ip_address: "172.16.40.5"
        - router_name: "pe1"
          interface: "eth2"
          ip_address: "172.16.40.6"
    - name: pa1-pe2
      subnet: "172.16.40.8/30"
      bandwidth: "1gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa1"
          interface: "eth6"
          ip_address: "172.16.40.9"
        - router_name: "pe2"
          interface: "eth1"
          ip_address: "172.16.40.10"
    - name: pa2-pe2
      subnet: "172.16.40.12/30"
      bandwidth: "1gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa2"
          interface: "eth6"
          ip_address: "172.16.40.13"
        - router_name: "pe2"
          interface: "eth2"
          ip_address: "172.16.40.14"
    - name: pa1-pe3
      subnet: "172.16.40.16/30"
      bandwidth: "1gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa1"
          interface: "eth7"
          ip_address: "172.16.40.17"
        - router_name: "pe3"
          interface: "eth1"
          ip_address: "172.16.40.18"
    - name: pa3-pe3
      subnet: "172.16.40.20/30"
      bandwidth: "1gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa3"
          interface: "eth5"
          ip_address: "172.16.40.21"
        - router_name: "pe3"
          interface: "eth2"
          ip_address: "172.16.40.22"
    - name: pa2-pe4
      subnet: "172.16.40.24/30"
      bandwidth: "1gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa2"
          interface: "eth7"
          ip_address: "172.16.40.25"
        - router_name: "pe4"
          interface: "eth1"
          ip_address: "172.16.40.26"
    - name: pa3-pe4
      subnet: "172.16.40.28/30"
      bandwidth: "1gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa3"
          interface: "eth6"
          ip_address: "172.16.40.29"
        - router_name: "pe4"
          interface: "eth2"
          ip_address: "172.16.40.30"
    - name: pa2-pe5
      subnet: "172.16.40.32/30"
      bandwidth: "1gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa2"
          interface: "eth8"
          ip_address: "172.16.40.33"
        - router_name: "pe5"
          interface: "eth1"
          ip_address: "172.16.40.34"
    - name: pa4-pe5
      subnet: "172.16.40.36/30"
      bandwidth: "1gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa4"
          interface: "eth5"
          ip_address: "172.16.40.37"
        - router_name: "pe5"
          interface: "eth2"
          ip_address: "172.16.40.38"
    - name: pa1-pe6
      subnet: "172.16.40.40/30"
      bandwidth: "1gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa1"
          interface: "eth8"
          ip_address: "172.16.40.41"
        - router_name: "pe6"
          interface: "eth1"
          ip_address: "172.16.40.42"
    - name: pa4-pe6
      subnet: "172.16.40.44/30"
      bandwidth: "1gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa4"
          interface: "eth6"
          ip_address: "172.16.40.45"
        - router_name: "pe6"
          interface: "eth2"
          ip_address: "172.16.40.46"
    - name: pa3-pe7
      subnet: "172.16.40.48/30"
      bandwidth: "1gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa3"
          interface: "eth7"
          ip_address: "172.16.40.49"
        - router_name: "pe7"
          interface: "eth1"
          ip_address: "172.16.40.50"
    - name: pa4-pe7
      subnet: "172.16.40.52/30"
      bandwidth: "1gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa4"
          interface: "eth7"
          ip_address: "172.16.40.53"
        - router_name: "pe7"
          interface: "eth2"
          ip_address: "172.16.40.54"
    - name: pa3-pe8
      subnet: "172.16.40.56/30"
      bandwidth: "1gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa3"
          interface: "eth8"
          ip_address: "172.16.40.57"
        - router_name: "pe8"
          interface: "eth1"
          ip_address: "172.16.40.58"
    - name: pa4-pe8
      subnet: "172.16.40.60/30"
      bandwidth: "1gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa4"
          interface: "eth8"
          ip_address: "172.16.40.61"
        - router_name: "pe8"
          interface: "eth2"
          ip_address: "172.16.40.62"

    # ===================================================================
    # PE-CE Cell Site links @ 100Mbps (RAN access)
    # ===================================================================
    - name: pe6-ce-core1
      subnet: "10.94.0.0/30"
      bandwidth: "100mbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pe6"
          interface: "eth3"
          ip_address: "10.94.0.1"
        - router_name: "ce-core1"
          interface: "eth1"
          ip_address: "10.94.0.2"
    - name: pe1-ce-site1
      subnet: "10.94.1.0/30"
      bandwidth: "100mbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pe1"
          interface: "eth3"
          ip_address: "10.94.1.1"
        - router_name: "ce-site1"
          interface: "eth1"
          ip_address: "10.94.1.2"
    - name: pe2-ce-site2
      subnet: "10.94.2.0/30"
      bandwidth: "100mbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pe2"
          interface: "eth3"
          ip_address: "10.94.2.1"
        - router_name: "ce-site2"
          interface: "eth1"
          ip_address: "10.94.2.2"
    - name: pe3-ce-site3
      subnet: "10.94.3.0/30"
      bandwidth: "100mbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pe3"
          interface: "eth3"
          ip_address: "10.94.3.1"
        - router_name: "ce-site3"
          interface: "eth1"
          ip_address: "10.94.3.2"
    - name: pe4-ce-site4
      subnet: "10.94.4.0/30"
      bandwidth: "100mbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pe4"
          interface: "eth3"
          ip_address: "10.94.4.1"
        - router_name: "ce-site4"
          interface: "eth1"
          ip_address: "10.94.4.2"
    - name: pe5-ce-site5
      subnet: "10.94.5.0/30"
      bandwidth: "100mbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pe5"
          interface: "eth3"
          ip_address: "10.94.5.1"
        - router_name: "ce-site5"
          interface: "eth1"
          ip_address: "10.94.5.2"

    # ===================================================================
    # Core and Cell Site LANs
    # ===================================================================
    - name: lan-core1
      subnet: "10.102.1.0/24"
      bandwidth: "100mbit"
      gateway: "10.102.1.1"
      network_type: "multi-access"
      connected_routers:
        - router_name: "ce-core1"
          interface: "eth2"
          ip_address: "10.102.1.1"
    - name: lan-site1
      subnet: "10.103.1.0/24"
      bandwidth: "100mbit"
      gateway: "10.103.1.1"
      network_type: "multi-access"
      connected_routers:
        - router_name: "ce-site1"
          interface: "eth2"
          ip_address: "10.103.1.1"
    - name: lan-site2
      subnet: "10.103.2.0/24"
      bandwidth: "100mbit"
      gateway: "10.103.2.1"
      network_type: "multi-access"
      connected_routers:
        - router_name: "ce-site2"
          interface: "eth2"
          ip_address: "10.103.2.1"
    - name: lan-site3
      subnet: "10.103.3.0/24"
      bandwidth: "100mbit"
      gateway: "10.103.3.1"
      network_type: "multi-access"
      connected_routers:
        - router_name: "ce-site3"
          interface: "eth2"
          ip_address: "10.103.3.1"
    - name: lan-site4
      subnet: "10.103.4.0/24"
      bandwidth: "100mbit"
      gateway: "10.103.4.1"
      network_type: "multi-access"
      connected_routers:
        - router_name: "ce-site4"
          interface: "eth2"
          ip_address: "10.103.4.1"
    - name: lan-site5
      subnet: "10.103.5.0/24"
      bandwidth: "100mbit"
      gateway: "10.103.5.1"
      network_type: "multi-access"
      connected_routers:
        - router_name: "ce-site5"
          interface: "eth2"
          ip_address: "10.103.5.1"

    # ===================================================================
    # Management network
    # ===================================================================
    - name: mgmt
      subnet: "192.168.122.0/24"
      gateway: "192.168.122.1"
      network_type: "management"
      bandwidth: "unlimited"
      connected_routers:
        # P routers
        - { router_name: "p1", interface: "eth0", ip_address: "192.168.122.11" }
        - { router_name: "p2", interface: "eth0", ip_address: "192.168.122.12" }
        - { router_name: "p3", interface: "eth0", ip_address: "192.168.122.13" }
        - { router_name: "p4", interface: "eth0", ip_address: "192.168.122.14" }
        # RR routers
        - { router_name: "rr1", interface: "eth0", ip_address: "192.168.122.21" }
        - { router_name: "rr2", interface: "eth0", ip_address: "192.168.122.22" }
        # PA routers
        - { router_name: "pa1", interface: "eth0", ip_address: "192.168.122.31" }
        - { router_name: "pa2", interface: "eth0", ip_address: "192.168.122.32" }
        - { router_name: "pa3", interface: "eth0", ip_address: "192.168.122.33" }
        - { router_name: "pa4", interface: "eth0", ip_address: "192.168.122.34" }
        # PE routers
        - { router_name: "pe1", interface: "eth0", ip_address: "192.168.122.61" }
        - { router_name: "pe2", interface: "eth0", ip_address: "192.168.122.62" }
        - { router_name: "pe3", interface: "eth0", ip_address: "192.168.122.63" }
        - { router_name: "pe4", interface: "eth0", ip_address: "192.168.122.64" }
        - { router_name: "pe5", interface: "eth0", ip_address: "192.168.122.65" }
        - { router_name: "pe6", interface: "eth0", ip_address: "192.168.122.66" }
        - { router_name: "pe7", interface: "eth0", ip_address: "192.168.122.67" }
        - { router_name: "pe8", interface: "eth0", ip_address: "192.168.122.68" }
        # RAN CE routers (5GC core + 5 cell sites)
        - { router_name: "ce-core1", interface: "eth0", ip_address: "192.168.122.200" }
        - { router_name: "ce-site1", interface: "eth0", ip_address: "192.168.122.201" }
        - { router_name: "ce-site2", interface: "eth0", ip_address: "192.168.122.202" }
        - { router_name: "ce-site3", interface: "eth0", ip_address: "192.168.122.203" }
        - { router_name: "ce-site4", interface: "eth0", ip_address: "192.168.122.204" }
        - { router_name: "ce-site5", interface: "eth0", ip_address: "192.168.122.205" }

    # ===================================================================
    # Loopback network
    # ===================================================================
    - name: loopbacks
      subnet: "10.0.0.0/24"
      network_type: "loopback"
      bandwidth: "unlimited"

  # ===================================================================
  # ROUTERS
  # ===================================================================
  routers:
    # ===================================================================
    # P ROUTERS (Core)
    # ===================================================================
    - name: "p1"
      hostname: "p1"
      router_id: "10.0.0.3"
      role: "P"
      location:
        latitude: 51.5074
        longitude: -0.1278
        city: "London"
        country: "United Kingdom"
        site: "London-DC1"
      interfaces:
        - { name: "eth0", network: "mgmt" }
        - { name: "eth1", network: "p1-p2" }
        - { name: "eth2", network: "p1-p3" }
        - { name: "eth3", network: "p1-p4" }
        - { name: "eth4", network: "p1-rr1" }
        - { name: "eth5", network: "p1-pa1" }
        - { name: "eth6", network: "p1-pa2" }
        - { name: "lo", network: "loopbacks" }

