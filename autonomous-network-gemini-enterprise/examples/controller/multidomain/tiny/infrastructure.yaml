apiVersion: google.dev/v1
kind: VyOSInfrastructure
metadata:
  name: free5gc-infra
  namespace: network
  labels:
    type: telco-lab
    environment: lab
spec:
  description: "Mobile Infrastructure"
  networks:
    # P1 to CE uplinks
    - name: p1-ce-core1
      subnet: "172.16.90.0/24"
      bandwidth: "100mbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p1"
          interface: "eth1"
          ip_address: "172.16.90.1"
        - router_name: "ce-core1"
          interface: "eth1"
          ip_address: "172.16.90.2"
    - name: p1-ce-cell1
      subnet: "172.16.100.0/24"
      bandwidth: "100mbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p1"
          interface: "eth2"
          ip_address: "172.16.100.1"
        - router_name: "ce-cell1"
          interface: "eth1"
          ip_address: "172.16.100.2"
    # Management and loopback
    - name: mgmt
      subnet: "192.168.122.0/24"
      bandwidth: "unlimited"
      gateway: "192.168.122.1"
      network_type: "management"
      connected_routers:
        - router_name: "p1"
          interface: "eth0"
          ip_address: "192.168.122.11"
        - router_name: "ce-core1"
          interface: "eth0"
          ip_address: "192.168.122.44"
        - router_name: "ce-cell1"
          interface: "eth0"
          ip_address: "192.168.122.45"
    - name: loopbacks
      subnet: "10.0.0.0/24"
      bandwidth: "unlimited"
      network_type: "loopback"
    # CE LAN networks
    - name: lan-core1
      subnet: "10.101.2.0/24"
      bandwidth: "100mbit"
      gateway: "10.101.2.1"
      network_type: "multi-access"
      connected_routers:
        - router_name: "ce-core1"
          interface: "eth2"
          ip_address: "10.101.2.1"
    - name: lan-cell1
      subnet: "10.101.1.0/24"
      bandwidth: "100mbit"
      gateway: "10.101.1.1"
      network_type: "multi-access"
      connected_routers:
        - router_name: "ce-cell1"
          interface: "eth2"
          ip_address: "10.101.1.1"
  routers:
    - name: "p1"
      hostname: "p1"
      router_id: "10.0.0.1"
      role: "P"
      location:
        latitude: 51.5074
        longitude: -0.1278
        city: "London"
        country: "United Kingdom"
        site: "London-DC1"
      interfaces:
        - name: "eth0"
          network: "mgmt"
        - name: "eth1"
          network: "p1-ce-core1"
        - name: "eth2"
          network: "p1-ce-cell1"
        - name: "lo"
          network: "loopbacks"
    - name: "ce-core1"
      hostname: "ce-core1"
      router_id: "10.0.0.2"
      role: "CE"
      location:
        latitude: 52.6309
        longitude: 1.2974
        city: "Norwich"
        country: "United Kingdom"
        site: "Norwich-Site1"
      interfaces:
        - name: "eth0"
          network: "mgmt"
        - name: "eth1"
          network: "p1-ce-core1"
        - name: "eth2"
          network: "lan-core1"
        - name: "lo"
          network: "loopbacks"
    - name: "ce-cell1"
      hostname: "ce-cell1"
      router_id: "10.0.0.3"
      role: "CE"
      location:
        latitude: 52.4082
        longitude: -1.5109
        city: "Coventry"
        country: "United Kingdom"
        site: "Coventry-Site1"
      interfaces:
        - name: "eth0"
          network: "mgmt"
        - name: "eth1"
          network: "p1-ce-cell1"
        - name: "eth2"
          network: "lan-cell1"
        - name: "lo"
          network: "loopbacks"
  devices:
    # radio network device (ce-cell1 LAN)
    - name: cell1
      network_name: "lan-cell1"
      ip_address: "10.101.1.10"
      mgmt_ip: "192.168.122.60"
      gateway: "10.101.1.1"

    # free5gc network functions — all on ce-core1 LAN
    - name: nrf
      network_name: "lan-core1"
      ip_address: "10.101.2.10"
      mgmt_ip: "192.168.122.61"
      gateway: "10.101.2.1"
    - name: amf
      network_name: "lan-core1"
      ip_address: "10.101.2.11"
      mgmt_ip: "192.168.122.62"
      gateway: "10.101.2.1"
    - name: smf
      network_name: "lan-core1"
      ip_address: "10.101.2.12"
      mgmt_ip: "192.168.122.63"
      gateway: "10.101.2.1"
    - name: upf
      network_name: "lan-core1"
      ip_address: "10.101.2.13"
      mgmt_ip: "192.168.122.64"
      gateway: "10.101.2.1"
    - name: ausf
      network_name: "lan-core1"
      ip_address: "10.101.2.14"
      mgmt_ip: "192.168.122.65"
      gateway: "10.101.2.1"
    - name: udm
      network_name: "lan-core1"
      ip_address: "10.101.2.15"
      mgmt_ip: "192.168.122.66"
      gateway: "10.101.2.1"
    - name: udr
      network_name: "lan-core1"
      ip_address: "10.101.2.16"
      mgmt_ip: "192.168.122.67"
      gateway: "10.101.2.1"
    - name: pcf
      network_name: "lan-core1"
      ip_address: "10.101.2.17"
      mgmt_ip: "192.168.122.68"
      gateway: "10.101.2.1"
    - name: nssf
      network_name: "lan-core1"
      ip_address: "10.101.2.18"
      mgmt_ip: "192.168.122.69"
      gateway: "10.101.2.1"
    - name: webui
      network_name: "lan-core1"
      ip_address: "10.101.2.20"
      mgmt_ip: "192.168.122.71"
      gateway: "10.101.2.1"
    - name: mongodb
      network_name: "lan-core1"
      ip_address: "10.101.2.21"
      mgmt_ip: "192.168.122.72"
      gateway: "10.101.2.1"
      image: "mongo"
    # Internet simulator on the core LAN, reachable via UPF N6 masquerade
    - name: internet
      network_name: "lan-core1"
      ip_address: "10.101.2.22"
      mgmt_ip: "192.168.122.73"
      gateway: "10.101.2.1"
