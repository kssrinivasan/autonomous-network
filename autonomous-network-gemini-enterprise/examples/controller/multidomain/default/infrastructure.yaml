          network: "pe1-ce-core1"
        - name: "eth2"
          network: "lan-core1"
        - name: "lo"
          network: "loopbacks"
    # Radio access CE routers (pe2, pe3, pe4)
    - name: "ce-cell1"
      hostname: "ce-cell1"
      router_id: "10.0.0.111"
      role: "CE"
      location:
        latitude: 52.2465
        longitude: 0.7135
        city: "Bury St Edmunds"
        country: "United Kingdom"
        site: "BurySt-RAN1"
      interfaces:
        - name: "eth0"
          network: "mgmt"
        - name: "eth1"
          network: "pe2-ce-cell1"
        - name: "eth2"
          network: "lan-cell1"
        - name: "lo"
          network: "loopbacks"
    - name: "ce-cell2"
      hostname: "ce-cell2"
      router_id: "10.0.0.112"
      role: "CE"
      location:
        latitude: 50.7692
        longitude: 0.2851
        city: "Eastbourne"
        country: "United Kingdom"
        site: "Eastbourne-RAN1"
      interfaces:
        - name: "eth0"
          network: "mgmt"
        - name: "eth1"
          network: "pe3-ce-cell2"
        - name: "eth2"
          network: "lan-cell2"
        - name: "lo"
          network: "loopbacks"
    - name: "ce-cell3"
      hostname: "ce-cell3"
      router_id: "10.0.0.113"
      role: "CE"
      location:
        latitude: 51.5842
        longitude: -3.0067
        city: "Newport"
        country: "United Kingdom"
        site: "Newport-RAN1"
      interfaces:
        - name: "eth0"
          network: "mgmt"
        - name: "eth1"
          network: "pe4-ce-cell3"
        - name: "eth2"
          network: "lan-cell3"
        - name: "lo"
          network: "loopbacks"
  devices:
    # free5gc network functions on ce-core1 LAN (pe1)
    - name: nrf
      network_name: "lan-core1"
      ip_address: "10.102.1.10"
      mgmt_ip: "192.168.122.60"
      gateway: "10.102.1.1"
    - name: amf
      network_name: "lan-core1"
      ip_address: "10.102.1.11"
      mgmt_ip: "192.168.122.61"
      gateway: "10.102.1.1"
    - name: smf
      network_name: "lan-core1"
      ip_address: "10.102.1.12"
      mgmt_ip: "192.168.122.62"
      gateway: "10.102.1.1"
    - name: upf
      network_name: "lan-core1"
      ip_address: "10.102.1.13"
      mgmt_ip: "192.168.122.63"
      gateway: "10.102.1.1"
    - name: ausf
      network_name: "lan-core1"
      ip_address: "10.102.1.14"
      mgmt_ip: "192.168.122.64"
      gateway: "10.102.1.1"
    - name: udm
      network_name: "lan-core1"
      ip_address: "10.102.1.15"
      mgmt_ip: "192.168.122.65"
      gateway: "10.102.1.1"
    - name: udr
      network_name: "lan-core1"
      ip_address: "10.102.1.16"
      mgmt_ip: "192.168.122.66"
      gateway: "10.102.1.1"
    - name: pcf
      network_name: "lan-core1"
      ip_address: "10.102.1.17"
      mgmt_ip: "192.168.122.67"
      gateway: "10.102.1.1"
    - name: nssf
      network_name: "lan-core1"
      ip_address: "10.102.1.18"
      mgmt_ip: "192.168.122.68"
      gateway: "10.102.1.1"
    - name: webui
      network_name: "lan-core1"
      ip_address: "10.102.1.20"
      mgmt_ip: "192.168.122.69"
      gateway: "10.102.1.1"
    - name: mongodb
      network_name: "lan-core1"
      ip_address: "10.102.1.21"
      mgmt_ip: "192.168.122.70"
      gateway: "10.102.1.1"
      image: "mongo"
    - name: internet
      network_name: "lan-core1"
      ip_address: "10.102.1.22"
      mgmt_ip: "192.168.122.71"
      gateway: "10.102.1.1"
