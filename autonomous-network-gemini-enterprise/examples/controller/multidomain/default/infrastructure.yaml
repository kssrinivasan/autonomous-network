    - name: cell1a
      network_name: "lan-cell1"
      ip_address: "10.103.1.10"
      mgmt_ip: "192.168.122.72"
      gateway: "10.103.1.1"
    - name: cell1b
      network_name: "lan-cell1"
      ip_address: "10.103.1.11"
      mgmt_ip: "192.168.122.73"
      gateway: "10.103.1.1"
    - name: cell2a
      network_name: "lan-cell2"
      ip_address: "10.103.2.10"
      mgmt_ip: "192.168.122.74"
      gateway: "10.103.2.1"
    - name: cell2b
      network_name: "lan-cell2"
      ip_address: "10.103.2.11"
      mgmt_ip: "192.168.122.75"
      gateway: "10.103.2.1"
    - name: cell3a
      network_name: "lan-cell3"
      ip_address: "10.103.3.10"
      mgmt_ip: "192.168.122.76"
      gateway: "10.103.3.1"
    - name: cell3b
      network_name: "lan-cell3"
