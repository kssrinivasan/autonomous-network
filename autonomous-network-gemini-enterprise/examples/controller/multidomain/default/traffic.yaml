# 5G UE traffic tests — all UEs → internet, bidirectional multi_sine
#
# ── Topology ──────────────────────────────────────────────────────────────────
#
#   6 gNB cell sites (cell1a/b on lan-cell1, cell2a/b on lan-cell2,
#                     cell3a/b on lan-cell3)
#   internet  (10.102.1.22, lan-core1, behind ce-core1)
#
#   Path via 5G user-plane:
#     UE uesimtun → UERANSIM gNB → AMF/SMF → UPF N6 masquerade → internet
#
#   ue_imsi causes the operator to resolve the uesimtun IP for the specified
#   UE and bind the traffic-agent source socket to it so packets traverse
#   the full 5G data-plane rather than the plain LAN path.
#
# ── IMSI allocation ───────────────────────────────────────────────────────────
#
#   cell1a  gnbId 0x1  IMSIs 208930000000001-005
#   cell1b  gnbId 0x2  IMSIs 208930000000006-010
#   cell2a  gnbId 0x3  IMSIs 208930000000011-015
#   cell2b  gnbId 0x4  IMSIs 208930000000016-020
#   cell3a  gnbId 0x5  IMSIs 208930000000021-025
#   cell3b  gnbId 0x6  IMSIs 208930000000026-030
#
# ── Time compression ──────────────────────────────────────────────────────────
#
#   15 real seconds  = 1 simulated hour
#   360 real seconds = 1 simulated day   (6 minutes)
#   172 800 seconds  = 48 real hours ≈ 480 simulated days ≈ 1.3 simulated years
#
# ── Traffic pattern (5G UE mobile broadband) ──────────────────────────────────
#
#   Uplink:   bw(t) = 5 + 3×sin(2π(t−75)/180) + 1×sin(2π(t−210)/360) + 1×sin(2π(t−1470)/2520)
#             floor ~1 Mbps overnight; peaks ~10 Mbps at 08:00 and 20:00 sim
#   Downlink: bw(t) = 15 + 10×sin(2π(t−75)/180) + 4×sin(2π(t−210)/360) + 2×sin(2π(t−1470)/2520)
#             floor ~3 Mbps overnight; peaks ~31 Mbps at 20:00 sim
#
---
# ════════════════════════════════════════════════════════════════════════
#  cell1a  —  UEs 001-005  (gnbId 0x1, lan-cell1, 10.103.1.0/24)
# ════════════════════════════════════════════════════════════════════════
apiVersion: google.dev/v1
kind: TrafficTest
metadata:
  name: cell1a-ue1-internet-tcp
  namespace: network
  labels:
    scenario: 5g-ue-data
    cellsite: cell1a
    pattern: multi_sine
    direction: bidirectional
    compression: 240x
spec:
  source_devices: [cell1a]
  destination_device: internet
  protocol: TCP
  duration: 172800
  cellSiteRef: cellsite-cell1a
  ue_imsi: "208930000000001"
  bandwidth: 12Mbps
  pattern_type: multi_sine
  pattern_config:
    time_reference: elapsed
    base_rate: 5Mbps
    components:
      - { period: 180,  amplitude: 3Mbps, phase_offset: -75   }
      - { period: 360,  amplitude: 1Mbps, phase_offset: -210  }
      - { period: 2520, amplitude: 1Mbps, phase_offset: -1470 }
    noise_stddev_pct: 5.0
    min_rate: 1Mbps
    max_rate: 15Mbps
  bidirectional: true
  reverse_bandwidth: 35Mbps
  reverse_pattern_type: multi_sine
  reverse_pattern_config:
    time_reference: elapsed
    base_rate: 15Mbps
    components:
      - { period: 180,  amplitude: 10Mbps, phase_offset: -75   }
      - { period: 360,  amplitude: 4Mbps,  phase_offset: -210  }
      - { period: 2520, amplitude: 2Mbps,  phase_offset: -1470 }
    noise_stddev_pct: 4.0
    min_rate: 3Mbps
    max_rate: 40Mbps
  concurrent_users: 5
---
