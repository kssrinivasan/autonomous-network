      bandwidth: "1gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa4"
          interface: "eth8"
          ip_address: "172.16.40.61"
        - router_name: "pe8"
          interface: "eth2"
          ip_address: "172.16.40.62"

    # ===================================================================
    # PE-CE links @ 100Mbps
    # ===================================================================
    - name: pe1-ce1-spoke
      subnet: "10.50.1.0/30"
      bandwidth: "100mbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pe1"
          interface: "eth3"
          ip_address: "10.50.1.1"
        - router_name: "ce1-spoke"
          interface: "eth1"
          ip_address: "10.50.1.2"
    - name: pe2-ce-hub-blue
      subnet: "10.50.2.0/30"
      bandwidth: "100mbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pe2"
          interface: "eth3"
          ip_address: "10.50.2.1"
        - router_name: "ce-hub-blue"
          interface: "eth1"
          ip_address: "10.50.2.2"
    - name: pe3-ce2-spoke
      subnet: "10.50.3.0/30"
      bandwidth: "100mbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pe3"
          interface: "eth3"
          ip_address: "10.50.3.1"
        - router_name: "ce2-spoke"
          interface: "eth1"
          ip_address: "10.50.3.2"
    - name: pe5-ce3-spoke
      subnet: "10.50.5.0/30"
      bandwidth: "100mbit"
      network_type: "p2p"
