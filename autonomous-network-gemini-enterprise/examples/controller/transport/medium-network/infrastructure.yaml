      network_type: "p2p"
      connected_routers:
        - router_name: "pa1"
          interface: "eth7"
          ip_address: "172.16.40.17"
        - router_name: "pe3"
          interface: "eth1"
          ip_address: "172.16.40.18"
    - name: pa3-pe3
      subnet: "172.16.40.20/30"
      bandwidth: "1gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa3"
          interface: "eth5"
          ip_address: "172.16.40.21"
        - router_name: "pe3"
          interface: "eth2"
          ip_address: "172.16.40.22"
    - name: pa2-pe4
