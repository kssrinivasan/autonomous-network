          interface: "eth7"
          ip_address: "172.16.40.49"
        - router_name: "pe7"
          interface: "eth1"
          ip_address: "172.16.40.50"
    - name: pa4-pe7
      subnet: "172.16.40.52/30"
      bandwidth: "1gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa4"
          interface: "eth7"
          ip_address: "172.16.40.53"
        - router_name: "pe7"
          interface: "eth2"
          ip_address: "172.16.40.54"
    - name: pa3-pe8
      subnet: "172.16.40.56/30"
      bandwidth: "1gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa3"
          interface: "eth8"
          ip_address: "172.16.40.57"
        - router_name: "pe8"
          interface: "eth1"
          ip_address: "172.16.40.58"
    - name: pa4-pe8
