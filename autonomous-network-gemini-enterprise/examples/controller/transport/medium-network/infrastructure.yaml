          interface: "eth7"
          ip_address: "172.16.40.25"
        - router_name: "pe4"
          interface: "eth1"
          ip_address: "172.16.40.26"
    - name: pa3-pe4
      subnet: "172.16.40.28/30"
      bandwidth: "1gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa3"
          interface: "eth6"
          ip_address: "172.16.40.29"
        - router_name: "pe4"
          interface: "eth2"
          ip_address: "172.16.40.30"
    - name: pa2-pe5
      subnet: "172.16.40.32/30"
      bandwidth: "1gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa2"
          interface: "eth8"
          ip_address: "172.16.40.33"
        - router_name: "pe5"
          interface: "eth1"
          ip_address: "172.16.40.34"
    - name: pa4-pe5
      subnet: "172.16.40.36/30"
      bandwidth: "1gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa4"
          interface: "eth5"
          ip_address: "172.16.40.37"
        - router_name: "pe5"
          interface: "eth2"
          ip_address: "172.16.40.38"
    - name: pa1-pe6
      subnet: "172.16.40.40/30"
      bandwidth: "1gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa1"
          interface: "eth8"
          ip_address: "172.16.40.41"
        - router_name: "pe6"
          interface: "eth1"
          ip_address: "172.16.40.42"
    - name: pa4-pe6
      subnet: "172.16.40.44/30"
      bandwidth: "1gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa4"
          interface: "eth6"
          ip_address: "172.16.40.45"
        - router_name: "pe6"
          interface: "eth2"
          ip_address: "172.16.40.46"
    - name: pa3-pe7
      subnet: "172.16.40.48/30"
