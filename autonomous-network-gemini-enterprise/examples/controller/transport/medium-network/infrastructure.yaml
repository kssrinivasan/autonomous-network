          interface: "eth3"
          ip_address: "10.50.7.1"
        - router_name: "ce4-spoke"
          interface: "eth1"
          ip_address: "10.50.7.2"
    - name: pe8-ce5-spoke
      subnet: "10.50.8.0/30"
      bandwidth: "100mbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pe8"
          interface: "eth3"
          ip_address: "10.50.8.1"
        - router_name: "ce5-spoke"
          interface: "eth1"
          ip_address: "10.50.8.2"
    - name: pe1-ce1-red
      subnet: "10.51.1.0/30"
      bandwidth: "100mbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pe1"
          interface: "eth4"
          ip_address: "10.51.1.1"
        - router_name: "ce1-red"
          interface: "eth1"
