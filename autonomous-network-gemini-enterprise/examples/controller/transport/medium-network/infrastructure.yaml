    # ===================================================================
    - name: pe1-ce1-green
      subnet: "10.52.1.0/30"
      bandwidth: "100mbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pe1"
          interface: "eth5"
          ip_address: "10.52.1.1"
        - router_name: "ce1-green"
          interface: "eth1"
          ip_address: "10.52.1.2"
    - name: pe2-ce2-green
      subnet: "10.52.2.0/30"
      bandwidth: "100mbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pe2"
          interface: "eth5"
          ip_address: "10.52.2.1"
        - router_name: "ce2-green"
          interface: "eth1"
          ip_address: "10.52.2.2"
    - name: pe3-ce3-green
      subnet: "10.52.3.0/30"
      bandwidth: "100mbit"
      network_type: "p2p"
