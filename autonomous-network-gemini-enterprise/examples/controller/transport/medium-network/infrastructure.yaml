apiVersion: google.dev/v1
kind: VyOSInfrastructure
metadata:
  name: medium-network-infra
  namespace: network
  labels:
    type: telco-lab
    environment: medium-network
spec:
  description: "Medium 3-tier hierarchical network with multi-area OSPF"
  networks:
    # ===================================================================
    # CORE MESH (P-P links) @ 10Gbps
    # ===================================================================
    - name: p1-p2
      subnet: "172.16.0.0/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p1"
          interface: "eth1"
          ip_address: "172.16.0.1"
        - router_name: "p2"
          interface: "eth1"
          ip_address: "172.16.0.2"
    - name: p1-p3
      subnet: "172.16.0.4/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p1"
          interface: "eth2"
          ip_address: "172.16.0.5"
        - router_name: "p3"
          interface: "eth1"
          ip_address: "172.16.0.6"
    - name: p1-p4
      subnet: "172.16.0.8/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p1"
          interface: "eth3"
          ip_address: "172.16.0.9"
        - router_name: "p4"
          interface: "eth1"
          ip_address: "172.16.0.10"
    - name: p2-p3
      subnet: "172.16.0.12/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p2"
          interface: "eth2"
          ip_address: "172.16.0.13"
        - router_name: "p3"
          interface: "eth2"
          ip_address: "172.16.0.14"
    - name: p2-p4
      subnet: "172.16.0.16/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p2"
          interface: "eth3"
          ip_address: "172.16.0.17"
        - router_name: "p4"
          interface: "eth2"
          ip_address: "172.16.0.18"
    - name: p3-p4
      subnet: "172.16.0.20/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p3"
          interface: "eth3"
          ip_address: "172.16.0.21"
        - router_name: "p4"
          interface: "eth3"
          ip_address: "172.16.0.22"

    # ===================================================================
    # CORE-RR links @ 10Gbps
    # ===================================================================
    - name: p1-rr1
      subnet: "172.16.10.0/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p1"
          interface: "eth4"
          ip_address: "172.16.10.1"
        - router_name: "rr1"
          interface: "eth1"
          ip_address: "172.16.10.2"
    - name: p2-rr1
      subnet: "172.16.10.4/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p2"
          interface: "eth4"
          ip_address: "172.16.10.5"
        - router_name: "rr1"
          interface: "eth2"
          ip_address: "172.16.10.6"
    - name: p3-rr2
      subnet: "172.16.10.8/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p3"
          interface: "eth4"
          ip_address: "172.16.10.9"
        - router_name: "rr2"
          interface: "eth1"
          ip_address: "172.16.10.10"
    - name: p4-rr2
      subnet: "172.16.10.12/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p4"
          interface: "eth4"
          ip_address: "172.16.10.13"
        - router_name: "rr2"
          interface: "eth2"
          ip_address: "172.16.10.14"

    # ===================================================================
    # CORE-PA links @ 10Gbps (each PA dual-homed to 2 P routers)
    # ===================================================================
    - name: p1-pa1
      subnet: "172.16.20.0/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p1"
          interface: "eth5"
          ip_address: "172.16.20.1"
        - router_name: "pa1"
          interface: "eth1"
          ip_address: "172.16.20.2"
    - name: p2-pa1
      subnet: "172.16.20.4/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p2"
          interface: "eth5"
          ip_address: "172.16.20.5"
        - router_name: "pa1"
          interface: "eth2"
          ip_address: "172.16.20.6"
    - name: p1-pa2
      subnet: "172.16.20.8/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p1"
          interface: "eth6"
          ip_address: "172.16.20.9"
        - router_name: "pa2"
          interface: "eth1"
          ip_address: "172.16.20.10"
    - name: p3-pa2
      subnet: "172.16.20.12/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p3"
          interface: "eth5"
          ip_address: "172.16.20.13"
        - router_name: "pa2"
          interface: "eth2"
          ip_address: "172.16.20.14"
    - name: p2-pa3
      subnet: "172.16.20.16/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p2"
          interface: "eth6"
          ip_address: "172.16.20.17"
        - router_name: "pa3"
          interface: "eth1"
          ip_address: "172.16.20.18"
    - name: p4-pa3
      subnet: "172.16.20.20/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p4"
          interface: "eth5"
          ip_address: "172.16.20.21"
        - router_name: "pa3"
          interface: "eth2"
          ip_address: "172.16.20.22"
    - name: p3-pa4
      subnet: "172.16.20.24/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p3"
          interface: "eth6"
          ip_address: "172.16.20.25"
        - router_name: "pa4"
          interface: "eth1"
          ip_address: "172.16.20.26"
    - name: p4-pa4
      subnet: "172.16.20.28/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "p4"
          interface: "eth6"
          ip_address: "172.16.20.29"
        - router_name: "pa4"
          interface: "eth2"
          ip_address: "172.16.20.30"

    # ===================================================================
    # PA ring links @ 10Gbps (for redundancy)
    # ===================================================================
    - name: pa1-pa2
      subnet: "172.16.30.0/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa1"
          interface: "eth3"
          ip_address: "172.16.30.1"
        - router_name: "pa2"
          interface: "eth3"
          ip_address: "172.16.30.2"
    - name: pa2-pa3
      subnet: "172.16.30.4/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa2"
          interface: "eth4"
          ip_address: "172.16.30.5"
        - router_name: "pa3"
          interface: "eth3"
          ip_address: "172.16.30.6"
    - name: pa3-pa4
      subnet: "172.16.30.8/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa3"
          interface: "eth4"
          ip_address: "172.16.30.9"
        - router_name: "pa4"
          interface: "eth3"
          ip_address: "172.16.30.10"
    - name: pa4-pa1
      subnet: "172.16.30.12/30"
      bandwidth: "10gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa4"
          interface: "eth4"
          ip_address: "172.16.30.13"
        - router_name: "pa1"
          interface: "eth4"
          ip_address: "172.16.30.14"

    # ===================================================================
    # PA-PE links @ 1Gbps (each PE dual-homed to 2 PAs)
    # ===================================================================
    - name: pa1-pe1
      subnet: "172.16.40.0/30"
      bandwidth: "1gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa1"
          interface: "eth5"
          ip_address: "172.16.40.1"
        - router_name: "pe1"
          interface: "eth1"
          ip_address: "172.16.40.2"
    - name: pa2-pe1
      subnet: "172.16.40.4/30"
      bandwidth: "1gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa2"
          interface: "eth5"
          ip_address: "172.16.40.5"
        - router_name: "pe1"
          interface: "eth2"
          ip_address: "172.16.40.6"
    - name: pa1-pe2
      subnet: "172.16.40.8/30"
      bandwidth: "1gbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pa1"
          interface: "eth6"
          ip_address: "172.16.40.9"
        - router_name: "pe2"
          interface: "eth1"
          ip_address: "172.16.40.10"
    - name: pa2-pe2
