      network_type: "p2p"
      connected_routers:
        - router_name: "pe4"
          interface: "eth3"
          ip_address: "10.51.4.1"
        - router_name: "ce4-red"
          interface: "eth1"
          ip_address: "10.51.4.2"
    - name: pe5-ce5-red
      subnet: "10.51.5.0/30"
      bandwidth: "100mbit"
      network_type: "p2p"
      connected_routers:
        - router_name: "pe5"
          interface: "eth4"
          ip_address: "10.51.5.1"
        - router_name: "ce5-red"
          interface: "eth1"
