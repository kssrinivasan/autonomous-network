apiVersion: google.dev/v1
kind: VyOSL3VPN
metadata:
  name: green-vpn-service
  namespace: network
spec:
  underlayRef: medium-network-underlay
  services:
    - name: "GREEN_MESH"
      type: "l3vpn"
      topology: "mesh"
  routers:
    # ===================================================================
    # MESH PEs (All 8 PEs participate in full mesh - Cross-Area)
    # ===================================================================
    - name: "pe1"
      vrfs:
        - name: "GREEN_MESH"
          table: 201  # v2.0: Dynamic allocation (was 500)
          rd: "10.0.0.60:201"  # v2.0: Loopback-based (was 10.*.*.1:3000)
          rt_export: ["65035:3000"]
          rt_import: ["65035:3000"]  # Symmetric - import same as export for full mesh
          interfaces: ["eth5"]  # PE-CE interface to ce1-green
      bgp:
        vrfs:
          - name: "GREEN_MESH"
            neighbors:
              - peer: "10.52.1.2"   # ce1-green IP
                remote_as: 65035

    - name: "pe2"
      vrfs:
        - name: "GREEN_MESH"
          table: 201  # v2.0: Dynamic allocation (was 500)
          rd: "10.0.0.61:201"  # v2.0: Loopback-based (was 10.*.*.1:3000)
          rt_export: ["65035:3000"]
          rt_import: ["65035:3000"]
          interfaces: ["eth5"]  # PE-CE interface to ce2-green
      bgp:
        vrfs:
          - name: "GREEN_MESH"
            neighbors:
              - peer: "10.52.2.2"   # ce2-green IP
                remote_as: 65035

