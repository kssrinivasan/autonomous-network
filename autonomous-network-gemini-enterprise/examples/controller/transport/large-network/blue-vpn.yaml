apiVersion: google.dev/v1
kind: VyOSL3VPN
metadata:
  name: blue-vpn-service
  namespace: network
spec:
  underlayRef: complex-network-underlay
  services:
    - name: "BLUE_SPOKE"
      type: "l3vpn"
      topology: "spoke"
    - name: "BLUE_HUB"
      type: "l3vpn"
      topology: "hub"
  routers:
    # ==================== HUB PE ====================
    - name: "pe2"
      vrfs:
        - name: "BLUE_HUB"
          table: 200  # v2.0: Dynamic allocation (was 400)
          rd: "10.0.0.8:200"  # v2.0: Loopback-based (was 10.*.*.1:1011)
          rt_export: ["65035:1030"]
          rt_import: ["65035:1011", "65035:1030"]
          interfaces: ["eth3"]
      bgp:
        vrfs:
          - name: "BLUE_HUB"
            neighbors: [{ peer: "10.80.80.2", remote_as: 65035 }]

    # ==================== SPOKE PEs ====================
