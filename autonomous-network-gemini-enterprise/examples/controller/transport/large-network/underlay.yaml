apiVersion: google.dev/v1
kind: VyOSUnderlay
metadata:
  name: complex-network-underlay
  namespace: network
spec:
  infrastructureRef: complex-network-infra
  routing:
    ospf:
      router_id_source: "loopback"
      areas:
        - area_id: "0.0.0.0"
          type: "backbone"
        - area_id: "0.0.0.1"
          type: "normal"
        - area_id: "0.0.0.2"
          type: "normal"
        - area_id: "0.0.0.3"
          type: "normal"
        - area_id: "0.0.0.4"
          type: "normal"
    bgp:
      as_number: 65001
      router_id_source: "loopback"
      route_reflectors: ["10.0.0.1", "10.0.0.2"]
  mpls:
    enabled: true
    ldp:
      router_id_interface: "loopback"
  routers:
    # ==================== CORE ROUTERS (Area 0 only) ====================
    - name: "p1"
      protocols:
        ospf:
          router_id: "10.0.0.3"
          areas: [{ area: "0.0.0.0", type: "backbone" }]
          passive_interfaces: ["lo"]
        mpls:
          enabled: true
          ldp:
            router_id: "10.0.0.3"
            interfaces: ["eth1", "eth2", "eth3", "eth4", "eth5", "eth6", "eth7", "eth8"]

    - name: "p2"
      protocols:
        ospf:
          router_id: "10.0.0.4"
          areas: [{ area: "0.0.0.0", type: "backbone" }]
          passive_interfaces: ["lo"]
        mpls:
          enabled: true
          ldp:
            router_id: "10.0.0.4"
            interfaces: ["eth1", "eth2", "eth3", "eth4", "eth5", "eth6", "eth7", "eth8", "eth9", "eth10"]

    - name: "p3"
      protocols:
        ospf:
          router_id: "10.0.0.5"
          areas: [{ area: "0.0.0.0", type: "backbone" }]
          passive_interfaces: ["lo"]
        mpls:
          enabled: true
          ldp:
            router_id: "10.0.0.5"
            interfaces: ["eth1", "eth2", "eth3", "eth4", "eth5", "eth6", "eth7", "eth8", "eth9", "eth10"]

    - name: "p4"
      protocols:
        ospf:
          router_id: "10.0.0.6"
          areas: [{ area: "0.0.0.0", type: "backbone" }]
          passive_interfaces: ["lo"]
        mpls:
          enabled: true
          ldp:
            router_id: "10.0.0.6"
            interfaces: ["eth1", "eth2", "eth3", "eth4", "eth5", "eth6", "eth7", "eth8", "eth9"]

    - name: "p5"
      protocols:
        ospf:
          router_id: "10.0.0.13"
          areas: [{ area: "0.0.0.0", type: "backbone" }]
          passive_interfaces: ["lo"]
        mpls:
          enabled: true
          ldp:
            router_id: "10.0.0.13"
            interfaces: ["eth1", "eth2", "eth3", "eth4", "eth5", "eth6", "eth7", "eth8"]

    - name: "p6"
      protocols:
        ospf:
          router_id: "10.0.0.14"
          areas: [{ area: "0.0.0.0", type: "backbone" }]
          passive_interfaces: ["lo"]
        mpls:
          enabled: true
          ldp:
            router_id: "10.0.0.14"
            interfaces: ["eth1", "eth2", "eth3", "eth4", "eth5", "eth6", "eth7"]

    # ==================== ROUTE REFLECTORS (Area 0) ====================
    - name: "rr1"
      protocols:
        ospf:
          router_id: "10.0.0.1"
          areas: [{ area: "0.0.0.0", type: "backbone" }]
          passive_interfaces: ["lo"]
        bgp:
          as_number: 65001
          router_id: "10.0.0.1"
          route_reflector: true
          neighbors:
            # iBGP to other RR
            - { peer: "10.0.0.2", remote_as: 65001, description: "iBGP to rr2" }
            # iBGP to all PEs as route reflector clients
            - { peer: "10.0.0.7", remote_as: 65001, route_reflector_client: true, description: "pe1" }
            - { peer: "10.0.0.8", remote_as: 65001, route_reflector_client: true, description: "pe2" }
            - { peer: "10.0.0.10", remote_as: 65001, route_reflector_client: true, description: "pe3" }
            - { peer: "10.0.0.11", remote_as: 65001, route_reflector_client: true, description: "pe4" }
            - { peer: "10.0.0.60", remote_as: 65001, route_reflector_client: true, description: "pe5" }
            - { peer: "10.0.0.61", remote_as: 65001, route_reflector_client: true, description: "pe6" }
            - { peer: "10.0.0.62", remote_as: 65001, route_reflector_client: true, description: "pe7" }
            - { peer: "10.0.0.63", remote_as: 65001, route_reflector_client: true, description: "pe8" }
            - { peer: "10.0.0.64", remote_as: 65001, route_reflector_client: true, description: "pe9" }
            - { peer: "10.0.0.65", remote_as: 65001, route_reflector_client: true, description: "pe10" }
            - { peer: "10.0.0.66", remote_as: 65001, route_reflector_client: true, description: "pe11" }
            - { peer: "10.0.0.67", remote_as: 65001, route_reflector_client: true, description: "pe12" }
        mpls:
          enabled: true
          ldp:
            router_id: "10.0.0.1"
            interfaces: ["eth1", "eth2", "eth3"]

    - name: "rr2"
      protocols:
        ospf:
          router_id: "10.0.0.2"
          areas: [{ area: "0.0.0.0", type: "backbone" }]
          passive_interfaces: ["lo"]
        bgp:
          as_number: 65001
          router_id: "10.0.0.2"
          route_reflector: true
          neighbors:
            # iBGP to other RR
            - { peer: "10.0.0.1", remote_as: 65001, description: "iBGP to rr1" }
            # iBGP to all PEs as route reflector clients
            - { peer: "10.0.0.7", remote_as: 65001, route_reflector_client: true, description: "pe1" }
            - { peer: "10.0.0.8", remote_as: 65001, route_reflector_client: true, description: "pe2" }
            - { peer: "10.0.0.10", remote_as: 65001, route_reflector_client: true, description: "pe3" }
            - { peer: "10.0.0.11", remote_as: 65001, route_reflector_client: true, description: "pe4" }
            - { peer: "10.0.0.60", remote_as: 65001, route_reflector_client: true, description: "pe5" }
            - { peer: "10.0.0.61", remote_as: 65001, route_reflector_client: true, description: "pe6" }
            - { peer: "10.0.0.62", remote_as: 65001, route_reflector_client: true, description: "pe7" }
            - { peer: "10.0.0.63", remote_as: 65001, route_reflector_client: true, description: "pe8" }
            - { peer: "10.0.0.64", remote_as: 65001, route_reflector_client: true, description: "pe9" }
            - { peer: "10.0.0.65", remote_as: 65001, route_reflector_client: true, description: "pe10" }
            - { peer: "10.0.0.66", remote_as: 65001, route_reflector_client: true, description: "pe11" }
            - { peer: "10.0.0.67", remote_as: 65001, route_reflector_client: true, description: "pe12" }
        mpls:
          enabled: true
          ldp:
            router_id: "10.0.0.2"
            interfaces: ["eth1", "eth2", "eth3"]

    # ==================== PRE-AGGREGATION ROUTERS (ABRs) ====================
    # UK Region ABRs - Areas 0 and 1
