apiVersion: google.dev/v1
kind: VyOSL3VPN
metadata:
  name: orange-vpn-service
  namespace: network
spec:
  underlayRef: large-network-underlay
  services:
    - name: "ORANGE_MESH"
      type: "l3vpn"
      topology: "mesh"
  routers:
    # ===================================================================
    # MESH PEs - All 12 PEs participate in cross-region mesh
    # ===================================================================
    - name: "pe1"
      vrfs:
        - name: "ORANGE_MESH"
          table: 200  # v2.0: Dynamic allocation (was 600)
          rd: "10.0.0.7:200"  # v2.0: Loopback-based (was 10.*.*.1:4000)
          rt_export: ["65035:4000"]
          rt_import: ["65035:4000"]
          interfaces: ["eth6"]
      bgp:
        vrfs:
          - name: "ORANGE_MESH"
            neighbors: [{ peer: "10.53.1.2", remote_as: 65035 }]

    - name: "pe2"
