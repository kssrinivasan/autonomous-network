---
# Core Domain Intent - Default 5G Core Network
# TMF921 Intent for 5G core network provisioning (HIGH-LEVEL ABSTRACTION)
# API Endpoint: POST http://<core-api-host>:8080/intent
#
# WHAT you specify (business intent):
#   - Service name and operator
#   - Service type (eMBB, URLLC, mMTC)
#   - Capacity requirements
#   - Service level expectations
#
# HOW the orchestrator derives (technical implementation):
#   - PLMN allocation (MCC/MNC)
#   - Network slice configuration (SST, SD, DNN)
#   - NF deployment plan and sizing
#   - Subscriber provisioning strategy
#   - IP address pool allocation

"@type": "Intent"
name: "default-5g-core"
description: "5G core network for enhanced mobile broadband services"
priority: 50
intentExpression:
  "@type": "IntentExpression"
  expectation:
    - "@type": "MobileServiceIntent"
      expectationVerb: "DELIVER"
      expectationObject:
        "@type": "MobileServiceService"
        serviceName: "UK Default 5G eMBB Core"
        operator: "TelecomCo UK"
        region: "United Kingdom"
        serviceType: "eMBB"

        capacity:
          totalSubscribers: 50000
          initialSubscribers: 10000
          peakConcurrentUsers: 5000
          aggregateThroughput: "10 Gbps"

        serviceLevel:
          downloadSpeed: "100 Mbps typical, 1 Gbps peak"
          uploadSpeed: "50 Mbps typical, 200 Mbps peak"
          latency: "< 20ms"
          reliability: "99.99%"

# ============================================================================
# ORCHESTRATOR AUTO-DERIVES:
# ============================================================================
#
# 1. PLMN Allocation:
#    Based on operator and region:
#    - MCC: 208 (France/UK test network)
#    - MNC: 93 (allocated for TelecomCo UK)
#
# 2. Network Slice Configuration:
#    serviceType "eMBB" maps to 3GPP standard slice:
#    - SST: 1 (eMBB service type)
#    - SD: "010203" (slice differentiator for this operator)
#    - DNN: "internet" (Data Network Name)
#    - DNS: 8.8.8.8 (default public DNS)
#
# 3. IP Address Pool Allocation:
#    Calculated from peakConcurrentUsers (5,000):
#    - UE address pool: 10.60.0.0/16 (65,534 addresses)
#    - Static pool: 10.60.100.0/24 (for IoT/fixed devices)
#
# 4. Network Function Deployment Plan:
#    Based on capacity and serviceType, deploys:
#    - NRF: 1 instance (Network Repository Function)
#    - AMF: 1 instance (Access and Mobility Management, TAC: 1)
#    - SMF: 1 instance (Session Management Function)
#    - UPF: 1 instance (User Plane Function)
#    - UDR: 1 instance (Unified Data Repository)
#    - UDM: 1 instance (Unified Data Management)
#    - AUSF: 1 instance (Authentication Server Function)
#    - PCF: 1 instance (Policy Control Function)
#    - WebUI: 1 instance (Web management interface)
#
#    For production at scale, orchestrator would calculate:
#    - AMF instances based on registrations/second
#    - UPF instances based on throughput requirements
#    - Geographic distribution based on region
#
# 5. Subscriber Provisioning Strategy:
#    - Initial provisioning: 10,000 subscribers (from initialSubscribers)
#    - IMSI range: 208930000000001 - 208930000010000
#    - Auto-generated K and OPc cryptographic keys
#    - All subscribers registered for slice SST=1, SD=010203, DNN=internet
#    - MSISDN allocation: Sequential from 0900000001
#
# 6. Container Assignment:
#    Resolves Device CRs created by VyOSInfrastructure:
#    - Maps NF types to available Device container names
#    - For this default network: nrf, amf, smf, upf, udr, udm, ausf, pcf, webui
#
# 7. MongoDB Configuration:
#    Auto-configured for UDM, UDR, PCF, NRF:
#    - URI: mongodb://10.102.1.21:27017
#
# ============================================================================
# Generated FiveGCore CR and Child NetworkFunction CRs:
# ============================================================================
#
# apiVersion: google.dev/v1
# kind: FiveGCore
# metadata:
#   name: free5gc-core
#   namespace: network
# spec:
#   image: device:latest
#   mongodbUri: mongodb://10.102.1.21:27017
#   plmnList:
#     - mcc: "208"
#       mnc: "93"
#   slices:
#     - sst: 1
#       sd: "010203"
#       dnnInfos:
#         - dnn: "internet"
#           dns:
#             ipv4: "8.8.8.8"
#           pools:
#             - cidr: "10.60.0.0/16"
#           staticPools:
#             - cidr: "10.60.100.0/24"
#   subscribers:
#     - imsi: "208930000000001"
#       msisdn: "0900000001"
#       key: "<auto-generated>"
#       opc: "<auto-generated>"
#       apn: "internet"
#       sst: 1
#       sd: "010203"
#     # ... 9,999 more subscribers auto-generated
#   network_functions:
#     - type: NRF
#       containerName: nrf
#     - type: AMF
#       containerName: amf
#       config:
#         tac: 1
#     - type: SMF
#       containerName: smf
#     - type: UPF
#       containerName: upf
#     - type: UDR
#       containerName: udr
#     - type: UDM
#       containerName: udm
#     - type: AUSF
#       containerName: ausf
#     - type: PCF
#       containerName: pcf
#     - type: WebUI
#       containerName: webui
#
# Child NetworkFunction CRs created automatically:
#   - free5gc-core-nrf
#   - free5gc-core-amf (with config.tac: 1)
#   - free5gc-core-smf
#   - free5gc-core-upf
#   - free5gc-core-udr
#   - free5gc-core-udm
#   - free5gc-core-ausf
#   - free5gc-core-pcf
#   - free5gc-core-webui
#
# Prerequisites:
#   - VyOSInfrastructure must create Device CRs for NF containers
#   - MongoDB must be accessible at mongodb://10.102.1.21:27017
#
# Cross-Domain Integration:
#   Radio domain CellSite intents will reference these NetworkFunction CRs:
#   - coreName: "free5gc-core" resolves to:
#     * amf_name: "free5gc-core-amf"
#     * upf_name: "free5gc-core-upf"
#     * smf_name: "free5gc-core-smf"
#   - Radio must match PLMN (208/93), TAC (1), slice (1/010203), IMSIs
