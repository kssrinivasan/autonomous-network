name: networkagent
description: "Network Agent Dashboard."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  graphview: ^1.2.0
  google_maps_flutter: ^2.14.0
  google_maps_flutter_web: ^0.5.14+3
  provider: ^6.1.4
  socket_io_client: ^3.1.1
  flutter_markdown: ^0.7.4+1
  url_launcher: ^6.2.5
  http: ^1.2.2
  go_router: ^14.6.2
  fl_chart: ^1.2.0
  flutter_ai_toolkit: ^0.10.0
  uuid: ^4.5.1
  intl: ^0.19.0
  pointer_interceptor: ^0.10.1+2
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
