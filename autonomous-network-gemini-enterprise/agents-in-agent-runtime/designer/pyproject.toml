[project]
name = "designer"
version = "0.1.0"
description = "Network Designer Agent for Vertex AI Agent Runtime"
authors = [
    {name = "Telco Lab", email = "telcolab@google.com"},
]
dependencies = [
    # imported directly by app_utils and the vendored agent_library
    # (deploy_agents.py copies lib/src/agent_library into app/) to discover
    # the Gitea Cloud Run service; transitive via py-gitea, pinned here anyway
    "requests",
    "google-auth",
    "google-adk[gcp,otel-gcp]>=2.6.0,<3.0.0",
    "a2a-sdk[http-server]>=1.0,<2",
    "nest-asyncio>=1.6.0,<2.0.0",
    "opentelemetry-instrumentation-google-genai>=0.1.0,<1.0.0",
    "gcsfs>=2024.11.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "google-cloud-aiplatform[agent-engines,evaluation]>=1.156.0",
    "protobuf>=6.31.1,<7.0.0",
    "kubernetes>=36.0.1",
    "google-cloud-container>=2.64.0",
    "ruamel-yaml>=0.19.1",
    "py-gitea>=0.2.10",
    "pyyaml>=6.0",
    "google-apps-chat>=0.1.0",
    "aiohttp>=3.13.4",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
]
requires-python = ">=3.11,<3.14"

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.5.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=1.156.0",
]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "C", "B", "UP", "RUF",
]
ignore = ["E501", "C901", "B006"]

[tool.uv]
environments = ["sys_platform == 'linux' or sys_platform == 'darwin'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
