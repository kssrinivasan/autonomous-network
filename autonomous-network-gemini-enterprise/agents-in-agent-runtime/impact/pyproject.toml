[project]
name = "impact"
version = "0.1.0"
description = "Network Impact Assessment Agent for Vertex AI Agent Runtime"
authors = [
    {name = "Telco Lab", email = "telcolab@google.com"},
]
dependencies = [
    # The mcp extra is not optional here: app/agent.py imports
    # google.adk.tools.mcp_tool to reach the Cloud Run tool server.
    "google-adk[gcp,mcp,otel-gcp]>=2.6.0,<3.0.0",
    "mcp>=1.0.0",
    "a2a-sdk[http-server]>=1.0,<2",
    "nest-asyncio>=1.6.0,<2.0.0",
    "opentelemetry-instrumentation-google-genai>=0.1.0,<1.0.0",
    "gcsfs>=2024.11.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "google-cloud-aiplatform[agent-engines,evaluation]>=1.156.0",
    "protobuf>=6.31.1,<7.0.0",
    "aiohttp>=3.13.4",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
]
requires-python = ">=3.11,<3.14"

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.5.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=1.156.0",
]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "C", "B", "UP", "RUF",
]
ignore = ["E501", "C901", "B006"]

[tool.ruff.lint.isort]
known-first-party = ["app", "frontend"]

[tool.uv]
# No override-dependencies. It used to pin google-cloud-aiplatform==1.149.0,
# which was a workaround from the ADK 1.x / agents-cli 0.3.0 era and now
# directly contradicts the >=1.156.0 floor the 1.3.1 scaffold needs -- the
# vertexai.agent_engines AdkApp that app/app_utils/reasoning_engine_adapter.py
# builds on is only the right shape from 1.156 onwards.
#
# No index-url either: uv.toml sets the default index and takes precedence over
# this section, so declaring it here only produces a "will be ignored" warning.
environments = ["sys_platform == 'linux' or sys_platform == 'darwin'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
