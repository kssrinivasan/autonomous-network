apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fivegcores.google.dev
  labels:
    type: core
spec:
  scope: Namespaced
  group: google.dev
  names:
    kind: FiveGCore
    plural: fivegcores
    singular: fivegcore
    shortNames:
      - fivegcore
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          description: |
            FiveGCore orchestrates a complete free5gc 5G core network deployment across pre-provisioned
            Device containers created by VyOSInfrastructure.

            ## Dependencies
            All container_names must reference Device CRs (created by VyOSInfrastructure) that are
            phase=Ready before any child NetworkFunction CRs are created. MongoDB must be reachable
            at spec.mongodbUri. This resource must reach phase=Ready before creating a CellSite.

            ## Child resource naming
            Child NetworkFunction CRs are named: {metadata.name}-{nf_type_lowercase}
            Example: a FiveGCore named "free5gc-core" creates "free5gc-core-amf", "free5gc-core-smf",
            "free5gc-core-upf", "free5gc-core-nrf", etc.
            Use these names in CellSite spec.gnb.amf_name and spec.gnb.upf_name.

            ## Cross-resource consistency
            CellSite fields that must match this FiveGCore:
            - spec.gnb.mcc / spec.gnb.mnc  → spec.plmnList[0].mcc / mnc
            - spec.gnb.tac                  → tac from AMF config.tac in spec.network_functions
            - spec.gnb.slices[].sst / sd    → spec.slices[].sst / sd
            - spec.ues[].apn                → a dnn from spec.slices[].dnnInfos[].dnn
            - spec.ues[].imsi               → must be registered in spec.subscribers

            ## Auto-injected fields
            The lifecycle automatically injects into child NetworkFunction CRs (no need to set in
            spec.network_functions[].config):
            - nrfUri          → all NFs except NRF (WebUI receives it for config but does not register)
            - mongodbUri      → NRF, UDR, PCF, UPF, WebUI (from spec.mongodbUri)
            - plmnList        → AMF, SMF, NRF, AUSF, N3IWF (from spec.plmnList)
            - snssaiInfos     → AMF, SMF, N3IWF (built from spec.slices)
            - upfList         → SMF (resolved from UPF Device CRs)
            - dnnList         → UPF (derived from spec.slices DNN info)
            - amfIp           → N3IWF (resolved from AMF Device CR)

            ## Example
              apiVersion: google.dev/v1
              kind: FiveGCore
              metadata:
                name: free5gc-core
                namespace: network
              spec:
                mongodbUri: "mongodb://db:27017"
                plmnList:
                  - mcc: "208"
                    mnc: "93"
                slices:
                  - sst: 1
                    sd: "010203"
                    dnnInfos:
                      - dnn: "internet"
                        dns:
                          ipv4: "8.8.8.8"
                        pools:
                          - cidr: "10.60.0.0/16"
                subscribers:
                  - imsi: "208930000000001"
                    key: "465B5CE8B199B49FAA5F0A2EE238A6BC"
                    opc: "E8ED289DEBA952E4283B54E88E6183CA"
                network_functions:
                  - type: NRF
                    container_name: "nrf"
                  - type: AMF
                    container_name: "amf"
                    config:
                      tac: 1
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - network_functions
              properties:
                image:
                  type: string
                  description: |
                    Container image containing free5gc binaries. All network functions use
                    this consolidated image with different entrypoint binaries.
                    Default: device:latest from local registry.
                  default: "device:latest"
                mongodbUri:
                  type: string
                  description: |
                    MongoDB connection URI shared by all NFs that need it (NRF, UDR, PCF, UPF, WebUI).
                    Injected automatically into child NetworkFunction CRs — no need to repeat it
                    in individual NF config blocks. Must be reachable from all NF Device containers.
                  default: "mongodb://db:27017"
                metrics:
                  type: object
                  description: |
                    Prometheus metrics endpoint configuration propagated to all child NetworkFunction CRs.
                    When enabled, each SBI NF (AMF, SMF, NRF, AUSF, PCF, UDM, UDR, NSSF) exposes
                    /metrics at http://<nf_ip>:<port>/metrics in Prometheus text format.
                    Per-NF overrides can be set via spec.network_functions[].config.metrics.
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                      default: 9089
                    scheme:
                      type: string
                      default: http
                      enum: [http, https]
                    namespace:
                      type: string
                      default: free5gc
                plmnList:
                  type: array
                  description: |
                    Public Land Mobile Network identities for this 5G deployment.
                    Injected automatically into AMF, SMF, NRF, AUSF, and N3IWF child NetworkFunction CRs.
                    Must match CellSite spec.gnb.mcc and spec.gnb.mnc.
                    Subscriber IMSIs must be prefixed with MCC+MNC (e.g., "208930000000001" for 208/93).
                  items:
                    type: object
                    required: [mcc, mnc]
                    properties:
                      mcc:
                        type: string
                        description: Mobile Country Code (3 digits, e.g., "208")
                        pattern: '^[0-9]{3}$'
                      mnc:
                        type: string
                        description: Mobile Network Code (2-3 digits, e.g., "93")
                        pattern: '^[0-9]{2,3}$'
                slices:
                  type: array
                  description: |
                    Network slice definitions (S-NSSAI + DNN configuration).
                    The lifecycle automatically:
                    - Builds SMF snssaiInfos and injects into SMF, AMF, N3IWF
                    - Derives UPF dnnList (unique DNNs, first pool CIDR each)
                    CellSite spec.gnb.slices must list the same SST/SD values.
                    UE apn must match a dnn in dnnInfos. Pool CIDRs must not overlap
                    with existing infrastructure address space.
                  items:
                    type: object
                    required: [sst]
                    properties:
                      sst:
                        type: integer
                        description: Slice/Service Type (1=eMBB, 2=URLLC, 3=mMTC)
                        minimum: 1
                        maximum: 255
                      sd:
                        type: string
                        description: Slice Differentiator (6 hex digits, e.g., "010203")
                        pattern: '^[0-9a-fA-F]{6}$'
                      dnnInfos:
                        type: array
                        description: Data Network configurations for this slice.
                        items:
                          type: object
                          properties:
                            dnn:
                              type: string
                              description: |
                                Data Network Name (e.g., "internet"). Must match UE apn.
                                Also used as UPF network instance name.
                            dns:
                              type: object
                              description: DNS server addresses for UEs on this DNN.
                              properties:
                                ipv4:
                                  type: string
                                  description: IPv4 DNS server (e.g., "8.8.8.8")
                                  pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}$'
                                ipv6:
                                  type: string
                                  description: IPv6 DNS server
                            pools:
                              type: array
                              description: UE IP address pools (allocated by UPF on PDU session establishment)
                              items:
                                type: object
                                required: [cidr]
                                properties:
                                  cidr:
                                    type: string
                                    description: CIDR block for UE addresses (e.g., "10.60.0.0/16")
                            staticPools:
                              type: array
                              description: Static UE IP address pools
                              items:
                                type: object
                                required: [cidr]
                                properties:
                                  cidr:
                                    type: string
                subscribers:
                  type: array
                  description: |
                    Subscriber credentials to provision in the free5gc WebUI when the core
                    is Ready. Each entry maps to a UDM/UDR subscriber record. Provisioning
                    is idempotent — re-applying the CR will not duplicate subscribers.
                  items:
                    type: object
                    required:
                      - imsi
                      - key
                      - opc
                    properties:
                      imsi:
                        type: string
                        description: International Mobile Subscriber Identity (15 digits)
                        pattern: '^[0-9]{15}$'
                      key:
                        type: string
                        description: Subscriber permanent key K (32 hex chars)
                        pattern: '^[0-9a-fA-F]{32}$'
                      opc:
                        type: string
                        description: Operator key OPc (32 hex chars)
                        pattern: '^[0-9a-fA-F]{32}$'
                      amf:
                        type: string
                        description: Authentication Management Field (4 hex chars)
                        default: "8000"
                        pattern: '^[0-9a-fA-F]{4}$'
                      apn:
                        type: string
                        description: Access Point Name / DNN for PDU session
                        default: "internet"
                      sst:
                        type: integer
                        description: Slice/Service Type
                        default: 1
                        minimum: 1
                        maximum: 255
                      sd:
                        type: string
                        description: Slice Differentiator (6 hex digits)
                        pattern: '^[0-9a-fA-F]{6}$'
                      sqn:
                        type: string
                        description: |
                          Initial authentication sequence number (12 hex chars, 48-bit SQN).
                          Must be compatible with the UE's stored SQN counter. Use the default
                          "000000000000" for fresh UERANSIM UEs (SQN counter starts at 0).
                          Increase only if the UE's USIM already has a non-zero SQN counter.
                        default: "000000000020"
                        pattern: '^[0-9a-fA-F]{12}$'
                      msisdn:
                        type: string
                        description: Mobile Subscriber ISDN Number (GPSI)
                network_functions:
                  type: array
                  description: |
                    List of free5gc network functions to deploy. Each NF will be deployed
                    into a pre-existing Device container specified by container_name.
                  items:
                    type: object
                    required:
                      - type
                      - container_name
                    properties:
                      type:
                        type: string
                        description: |
                          Network function type. Must match one of the free5gc NF types.
                        enum:
                          - AMF
                          - SMF
                          - UPF
                          - NRF
                          - UDR
                          - UDM
                          - AUSF
                          - NSSF
                          - PCF
                          - N3IWF
                          - WebUI
                      container_name:
                        type: string
                        description: |
                          Name of an existing Device CR created by VyOSInfrastructure.
                          The Device must exist and be Ready before NF deployment.
                          Maximum 8 characters (veth naming constraint).
                        maxLength: 8
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                      enabled:
                        type: boolean
                        description: |
                          Whether to deploy this network function. Set false to skip deployment
                          without removing the spec entry.
                        default: true
                      config:
                        type: object
                        description: |
                          NF-specific configuration parameters. Schema varies by NF type.
                          See NetworkFunction CRD for detailed config schemas per type.
                        x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: |
                    Current lifecycle phase:
                    - Pending: Validating spec and checking Device dependencies
                    - Creating: Generating NetworkFunction child CRs
                    - Ready: All NetworkFunction children are Ready
                    - Failed: One or more NetworkFunction children failed
                  enum:
                    - Pending
                    - Creating
                    - Ready
                    - Failed
                message:
                  type: string
                  description: Human-readable status message
                network_functions:
                  type: array
                  description: Status of each NetworkFunction child
                  items:
                    type: object
                    properties:
                      container_name:
                        type: string
                      type:
                        type: string
                      phase:
                        type: string
                      ready:
                        type: boolean
                      ip_address:
                        type: string
                        description: Resolved from Device CR
                      mgmt_ip:
                        type: string
                        description: Resolved from Device CR
  
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: NFs
          type: string
          description: Number of network functions deployed
          jsonPath: .status.network_functions[*].type
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
