---
- name: Manage N3IWF Network Function
  hosts: all
  become: true
  gather_facts: no

  vars:
    nf_type: n3iwf
    binary_path: "/opt/device/bin/free5gc/n3iwf"
    config_dest: "/opt/device/config/n3iwfcfg.yaml"
    config_tmp: "/tmp/{{ container_name }}-n3iwfcfg.yaml"

  tasks:
    - block:
        - name: Log playbook start
          shell: "docker exec {{ container_name }} sh -c \"echo '[N3IWF-PLAYBOOK] START operation={{ operation }} at '\\$(date +%s.%N) >> /tmp/n3iwf.log\""
          changed_when: true

        - name: Check if N3IWF process is already running
          shell: "docker exec {{ container_name }} pgrep -f {{ binary_path }}"
          register: nf_running_check
          failed_when: false
          changed_when: false

        - name: Log pgrep result
          shell: "docker exec {{ container_name }} sh -c \"echo '[N3IWF-PLAYBOOK] pgrep check: rc={{ nf_running_check.rc }} at '\\$(date +%s.%N) >> /tmp/n3iwf.log\""
          changed_when: true

        - name: Log start
          shell: "docker exec {{ container_name }} sh -c \"echo '[N3IWF-PLAYBOOK] Starting N3IWF at '\\$(date +%s.%N) >> /tmp/n3iwf.log\""
          changed_when: true
          when: nf_running_check.rc != 0

        - name: Log skip
          shell: "docker exec {{ container_name }} sh -c \"echo '[N3IWF-PLAYBOOK] Skipping N3IWF, already running at '\\$(date +%s.%N) >> /tmp/n3iwf.log\""
          changed_when: true
          when: nf_running_check.rc == 0

        - name: Render N3IWF config from template
          ansible.builtin.template:
            src: "n3iwfcfg.yaml.j2"
            dest: "{{ config_tmp }}"
          when: nf_running_check.rc != 0

        - name: Copy config into container
          shell: "docker cp {{ config_tmp }} {{ container_name }}:{{ config_dest }}"
          when: nf_running_check.rc != 0

        - name: Remove temp config file
          ansible.builtin.file:
            path: "{{ config_tmp }}"
            state: absent
          when: nf_running_check.rc != 0

        - name: Wait for NRF to be ready
          shell: |
            nrf_host=$(echo "{{ nrf_uri }}" | sed 's|https\?://||' | cut -d: -f1)
            nrf_port=$(echo "{{ nrf_uri }}" | sed 's|https\?://||' | cut -d: -f2)
            docker exec {{ container_name }} bash -c "echo > /dev/tcp/${nrf_host}/${nrf_port}"
          register: nrf_check
          retries: 15
          delay: 5
          until: nrf_check.rc == 0
          when: nf_running_check.rc != 0
        - name: Create IPsec VTI interface inside container
          shell: "docker exec {{ container_name }} bash -c 'ip link add name ipsec0 type vti local $(hostname -i | awk \"{print \\$1}\") remote 0.0.0.0 key 5'"
          when: nf_running_check.rc != 0
        - name: Assign address to IPsec VTI interface inside container
          shell: "docker exec {{ container_name }} ip addr add 10.0.0.1/24 dev ipsec0"
          when: nf_running_check.rc != 0
        - name: Bring up IPsec VTI interface inside container
          shell: "docker exec {{ container_name }} ip link set dev ipsec0 up"
          when: nf_running_check.rc != 0

        - name: Re-check if N3IWF was started by a concurrent run
          shell: "docker exec {{ container_name }} pgrep -f {{ binary_path }}"
          register: nf_recheck
          failed_when: false
          changed_when: false
          when: nf_running_check.rc != 0

        - name: Log starting N3IWF
          shell: "docker exec {{ container_name }} sh -c \"echo '[N3IWF-PLAYBOOK] About to start N3IWF process at '\\$(date +%s.%N) >> /tmp/n3iwf.log\""
          changed_when: true
          when: nf_running_check.rc != 0 and nf_recheck.rc != 0

        - name: Start N3IWF process
          shell: >
            flock -x /tmp/n3iwf-{{ container_name }}-start.lock
            bash -c 'docker exec {{ container_name }} pgrep -f {{ binary_path }} > /dev/null 2>&1 && exit 0;
            docker exec -d {{ container_name }}
            sh -c "exec {{ binary_path }} -c {{ config_dest }} >> /tmp/n3iwf.log 2>&1"'
          when: nf_running_check.rc != 0 and nf_recheck.rc != 0

        - name: Verify N3IWF process is running
          shell: "docker exec {{ container_name }} pgrep -f {{ binary_path }}"
          register: pgrep_result
          retries: 5
          delay: 2
          until: pgrep_result.rc == 0
          when: nf_running_check.rc != 0

        - name: Log N3IWF started
          shell: "docker exec {{ container_name }} sh -c \"echo '[N3IWF-PLAYBOOK] N3IWF process verified running at '\\$(date +%s.%N) >> /tmp/n3iwf.log\""
          changed_when: true
          when: nf_running_check.rc != 0

        - name: Set operation result
          set_fact:
            operation_result: "n3iwf started in {{ container_name }}"
          when: nf_running_check.rc != 0

        - name: Log playbook end
          shell: "docker exec {{ container_name }} sh -c \"echo '[N3IWF-PLAYBOOK] END operation=create at '\\$(date +%s.%N) >> /tmp/n3iwf.log\""
          changed_when: true

      when: operation == 'create'

    - block:
        - name: Log playbook start (delete)
          shell: "docker exec {{ container_name }} sh -c \"echo '[N3IWF-PLAYBOOK] START operation={{ operation }} at '\\$(date +%s.%N) >> /tmp/n3iwf.log\""
          changed_when: true

        - name: Check if N3IWF process is running
          shell: "docker exec {{ container_name }} pgrep -f {{ binary_path }}"
          register: nf_running_check
          failed_when: false
          changed_when: false

        - name: Log pgrep result
          shell: "docker exec {{ container_name }} sh -c \"echo '[N3IWF-PLAYBOOK] pgrep check: rc={{ nf_running_check.rc }} at '\\$(date +%s.%N) >> /tmp/n3iwf.log\""
          changed_when: true

        - name: Tear down IPsec VTI interface inside container
          shell: "docker exec {{ container_name }} ip link del ipsec0"
          failed_when: false
          when: nf_running_check.rc == 0

        - name: Stop N3IWF process
          shell: "docker exec {{ container_name }} pkill -f {{ binary_path }}"
          failed_when: false
          when: nf_running_check.rc == 0

        - name: Remove config file from container
          shell: "docker exec {{ container_name }} rm -f {{ config_dest }}"
          failed_when: false
          when: nf_running_check.rc == 0

        - name: Set operation result
          set_fact:
            operation_result: "n3iwf stopped in {{ container_name }}"
          when: nf_running_check.rc == 0

        - name: Set operation result (not running)
          set_fact:
            operation_result: "n3iwf not running so skipped in {{ container_name }}"
          when: nf_running_check.rc != 0

      when: operation == 'delete'

    - name: Display result
      debug:
        msg: "{{ operation_result | default('Operation complete') }}"
