[project]
name = "transport-intentserver"
version = "1.0.0"
description = "TMF921 Intent Management API for Layer 3 VPN provisioning"
readme = "Readme.md"
requires-python = ">=3.13"
license = {text = "Apache-2.0"}
authors = [
    {name = "Autonomous Network Lab"}
]
keywords = ["tmf921", "intent", "l3vpn", "actn", "network-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
]

dependencies = [
    "fastapi>=0.136.3,<1.0",
    "uvicorn[standard]>=0.49.0,<1.0",
    "pydantic>=2.10.6,<3.0",
    "httpx>=0.28.1,<1.0",
    "a2a-sdk[http-server]>=0.1.0",
    "google-cloud-spanner>=3.66.0,<4.0",
    "google-auth>=2.0.0,<3.0",
    "python-dotenv>=1.0.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.isort]
known-first-party = ["models", "clients"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
