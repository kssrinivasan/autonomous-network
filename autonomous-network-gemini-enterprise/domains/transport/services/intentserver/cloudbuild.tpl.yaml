steps:
  - name: 'gcr.io/cloud-builders/docker'
    script: |
      docker build \
        -t ${GOOGLE_REGION}-docker.pkg.dev/${GOOGLE_PROJECT}/${GOOGLE_REPO}/transport-intentserver:latest \
        -f domains/transport/services/intentserver/Dockerfile .
    automapSubstitutions: true

images:
  - '${GOOGLE_REGION}-docker.pkg.dev/${GOOGLE_PROJECT}/${GOOGLE_REPO}/transport-intentserver:latest'
