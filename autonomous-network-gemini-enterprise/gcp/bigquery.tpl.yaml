# Sink for the Spanner table of the same name, which supersedes
# TrafficFlowMetrics -- see the comment on TrafficFlowSeries in
# gcp/spanner.tpl.yaml. As with routerroutingseries, BigQuery never lost these
# rows (no primary key, nothing collided), but the collector derives the
# BigQuery table name from the Spanner one lowercased, so the new table needs a
# twin here. trafficflowmetrics is left in place for the history it holds.
apiVersion: bigquery.cnrm.cloud.google.com/v1beta1
kind: BigQueryTable
metadata:
  name: trafficflowseries
  namespace: ${GOOGLE_NAMESPACE}
  annotations:
    cnrm.cloud.google.com/project-id: ${GOOGLE_PROJECT}
spec:
  resourceID: trafficflowseries
  friendlyName: trafficflowseries
  datasetRef:
    name: serviceperformance
  schema: >
    [
      {"name": "flow_id", "type": "STRING", "mode": "NULLABLE", "description": "Traffic flow ID"},
      {"name": "timestamp", "type": "TIMESTAMP", "mode": "NULLABLE", "description": "Metric timestamp"},
      {"name": "node_name", "type": "STRING", "mode": "NULLABLE", "description": "Node name"},
      {"name": "metric_name", "type": "STRING", "mode": "NULLABLE", "description": "Metric name"},
      {"name": "role", "type": "STRING", "mode": "NULLABLE", "description": "Reporting end of the flow (source, destination)"},
      {"name": "metric_type", "type": "STRING", "mode": "NULLABLE", "description": "Metric type"},
      {"name": "value", "type": "FLOAT64", "mode": "NULLABLE", "description": "Metric numeric value"},
      {"name": "labels", "type": "JSON", "mode": "NULLABLE", "description": "Metric labels"}
    ]
---
