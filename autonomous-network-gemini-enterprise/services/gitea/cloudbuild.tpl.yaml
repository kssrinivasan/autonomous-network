steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - ${GOOGLE_REGION}-docker.pkg.dev/${GOOGLE_PROJECT}/${GOOGLE_REPO}/gitea:latest
      - .

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - ${GOOGLE_REGION}-docker.pkg.dev/${GOOGLE_PROJECT}/${GOOGLE_REPO}/gitea:latest

options:
  logging: CLOUD_LOGGING_ONLY
