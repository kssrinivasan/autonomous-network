[project]
name = "sharedmcp"
version = "0.1.0"
description = "MCP tool server for network agent operations"
authors = [
    {name = "Google LLC"},
]

dependencies = [
    "fastmcp==3.4.6",
    "kubernetes>=36.0.1,<37.0.0",
    "google-cloud-aiplatform>=1.154.0,<2.0.0",
    "google-cloud-spanner>=3.66.0,<4.0.0",
    "google-cloud-container>=2.64.0,<3.0.0",
    "google-cloud-run>=0.16.0,<1.0.0",
    "google-api-python-client>=2.197.0,<3.0.0",
    "ruamel.yaml>=0.19.1,<0.20.0",
    "py-gitea>=0.2.10,<0.3.0",
    "scikit-learn>=1.8.0,<2.0.0",
    "pandas>=3.0.3,<4.0.0",
    "numpy>=2.4.6,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]
requires-python = ">=3.11,<3.14"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
